[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "boberagent-capability-browser-interaction"
version = "0.1.0"
description = "Stateful managed browser interaction capability for BoberAgent"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "boberagent-contracts",
    "boberagent-sdk",
    "pydantic>=2.12,<3",
]

[tool.uv.sources]
boberagent-contracts = { workspace = true }
boberagent-sdk = { workspace = true }
