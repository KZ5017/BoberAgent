[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "boberagent-execution-node"
version = "0.0.0"
description = "Execution node package for BoberAgent"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "alembic>=1.16,<2",
    "boberagent-contracts",
    "boberagent-sdk",
    "boberagent-transport",
    "boberagent-transport-mcp",
    "packaging>=24,<27",
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
boberagent-contracts = { workspace = true }
boberagent-sdk = { workspace = true }
boberagent-transport = { workspace = true }
boberagent-transport-mcp = { workspace = true }

[project.scripts]
boberagent-node-mcp = "boberagent_execution_node.mcp_cli:main"
