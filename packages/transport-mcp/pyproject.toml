[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "boberagent-transport-mcp"
version = "0.0.0"
description = "MCP Streamable HTTP transport adapter for BoberAgent"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "boberagent-contracts",
    "boberagent-transport",
    "httpx2>=2.13,<3",
    "mcp==2.2.0",
    "pydantic>=2.12,<3",
    "uvicorn>=0.53,<1",
]

[tool.uv.sources]
boberagent-contracts = { workspace = true }
boberagent-transport = { workspace = true }
