[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "boberagent-transport"
version = "0.0.0"
description = "Transport-neutral protocol and in-memory adapter for BoberAgent"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "boberagent-contracts",
    "pydantic>=2.12,<3",
]

[tool.uv.sources]
boberagent-contracts = { workspace = true }
